<disk type='file' device='disk'>
    <driver name='qemu'
            type='qcow2'
            cache='none'
            discard='unmap'/>
    <source file='/var/lib/libvirt/images/gaming-vm.qcow2'/>
    <target dev='vda' bus='virtio'/>
</disk>
